  <main>

    <section>
      <h2>Photos of Damon</h2>
      <div class="gallery">
        <figure>
          <img src="images/damon-aland.jpg" alt="Damon standing on pink granite rocks by the sea in the Åland Islands, with pine trees and a sunset sky">
          <figcaption><strong>Åland Islands.</strong> Pink granite rocks, pine trees and a calm evening sea.</figcaption>
        </figure>
        <figure>
          <img src="images/damon-summer-sunset.jpg" alt="Damon standing on a wooden pier in Hanko at sunset, with the sun setting over the sea behind him">
          <figcaption><strong>Hanko.</strong> A summer sunset at the southernmost point of Finland.</figcaption>
        </figure>
        <figure>
          <img src="images/damon-autumn.jpg" alt="Damon standing under birch trees with yellow autumn leaves by a river in Kokkola">
          <figcaption><strong>Kokkola.</strong> Golden autumn birches along the river.</figcaption>
        </figure>
        <figure>
          <img src="images/damon-winter.jpg" alt="Damon standing on snow on the frozen sea, looking back at the camera">
          <figcaption><strong>Winter.</strong> A walk on the frozen sea, the perfect weather for a husky.</figcaption>
        </figure>
        <figure>
          <img src="images/damon-lofoten-mountain.jpg" alt="Damon on a mountain top in Lofoten, looking over green mountains, a blue bay and a sandy beach">
          <figcaption><strong>Lofoten.</strong> The view from the top of a mountain.</figcaption>
        </figure>
        <figure>
          <img src="images/damon-lofoten-village.jpg" alt="Damon sitting on a pier in front of red fishing houses and misty mountains in the village of Å in Lofoten">
          <figcaption><strong>Å, Lofoten.</strong> A small fishing village with red houses.</figcaption>
        </figure>
