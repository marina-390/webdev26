<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">

    <title>Centria Edu | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <div class="hero-content">

                    <span class="label">Basics of Web Development</span>

                    <h1>
                        Get in touch.
                    </h1>

                    <p>
                        Have a question or feedback about the course?
                        Fill in the form below and we will get back to you.
                        Fields marked with * are required.
                    </p>

                </div>
            </div>
        </section>

        <section class="topics" id="contact">
            <div class="container">

                <h2>Contact us</h2>

                <form class="card" action="https://httpbin.org/post" method="post">

                    <label for="name">Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >

                    <label for="email">Email address *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                    <label for="phone">Phone number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        autocomplete="tel"
                    >

                    <label for="subject">Subject *</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a subject</option>
                        <option value="feedback">Feedback</option>
                        <option value="question">Question</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="other">Other</option>
                    </select>

                    <fieldset>
                        <legend>Preferred contact method</legend>

                        <input
                            type="radio"
                            id="method-email"
                            name="contact_method"
                            value="email"
                            checked
                        >
                        <label for="method-email">Email</label>

                        <input
                            type="radio"
                            id="method-phone"
                            name="contact_method"
                            value="phone"
                        >
                        <label for="method-phone">Phone</label>
                    </fieldset>

                    <label for="message">Message *</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>

                    <button type="submit" class="button">Send message</button>

                </form>

            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>
</html>
